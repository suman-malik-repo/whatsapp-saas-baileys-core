# Manual testing deployment: no persistent disk. Local state is disposable.
# See docs/RENDER_DEPLOYMENT.md before deploying, especially recovery/re-pairing.
# Keep the repository private and connect Render's GitHub integration.
# render.persistent.yaml is the optional paid/disk alternative.
services:
  - type: web
    name: whatsapp-managed-worker
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /live
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MANAGED_MODE
        value: "true"
      - key: MANAGED_STORAGE_MODE
        value: ephemeral
      - key: DATA_DIR
        value: /tmp/whatsapp-data
      - key: WORKER_ID
        sync: false
      - key: WORKER_SECRET
        sync: false
      - key: GATEWAY_URL
        sync: false
