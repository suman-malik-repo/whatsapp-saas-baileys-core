# Reference template. The SaaS provisioner creates equivalent dedicated services.
# Configure WORKER_ID/WORKER_SECRET/GATEWAY_URL and register the worker with the
# gateway BEFORE first boot. Do not deploy this without a persistent disk.
services:
  - type: web
    name: whatsapp-managed-worker
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /live
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MANAGED_MODE
        value: "true"
      - key: DATA_DIR
        value: /var/data
      - key: WORKER_ID
        sync: false
      - key: WORKER_SECRET
        sync: false
      - key: GATEWAY_URL
        sync: false
    disk:
      name: whatsapp-session
      mountPath: /var/data
      sizeGB: 1
